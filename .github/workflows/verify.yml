name: Verify native app and local tools
run-name: Verify ${{ inputs.target || 'full' }} at ${{ github.ref_name }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Verification scope (portable does not qualify native app behavior)
        required: true
        default: full
        type: choice
        options: [full, portable]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}-${{ inputs.target || 'full' }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tooling/dev/quality.py bootstrap
      - run: make test-ci-monitor
      - run: python3 tooling/dev/quality.py lint --portable
      - run: python3 tooling/dev/quality.py test --portable
  apple:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'portable' }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      REHA_SIMULATOR_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tooling/dev/quality.py bootstrap
      - run: python3 tooling/dev/quality.py lint
      - run: make restore convert TARGET=all
      - run: python3 tooling/dev/quality.py test
      - run: python3 tooling/dev/quality.py build check-bindings
      - run: python3 tooling/dev/quality.py build device
      - name: Verify unsigned device bundle contents
        run: make --silent verify-bundle TARGET=device APP_BUNDLE="apps/ios/build/DerivedData/Build/Products/Release-iphoneos/Laßnitzhöhe.app" > apps/ios/build/device-bundle-verification.json
      - run: python3 tooling/dev/quality.py build simulator
      - name: Verify simulator bundle contents
        run: make --silent verify-bundle TARGET=simulator APP_BUNDLE="apps/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Laßnitzhöhe.app" > apps/ios/build/simulator-bundle-verification.json
      - run: make test-calendar-events
      - name: Run complete simulator UI suite
        timeout-minutes: 75
        shell: bash
        run: |
          make test-native-ui TEST_ARGS="--built -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 300 -resultBundlePath apps/ios/build/ci-ui.xcresult" 2>&1 | tee apps/ios/build/ci-ui.log
      - name: Collect focused native failure evidence
        if: ${{ always() }}
        timeout-minutes: 5
        run: python3 tooling/checks/collect-native-triage.py --bundle apps/ios/build/ci-ui.xcresult --output apps/ios/build/ci-native-triage --commit "${{ github.sha }}"
      - name: Retain focused native failure evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-triage-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/ios/build/ci-native-triage
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
      - name: Retain synthetic native test evidence
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-checks-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/ios/build/*-bundle-verification.json
            apps/ios/build/simulator-environment-*.json
            apps/ios/build/ci-ui.xcresult
            apps/ios/build/ci-ui.log
            apps/ios/build/EventTests/Logs/Test/*.xcresult
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
