[package]
name = "reha-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
onnx = ["reha-core/onnx"]
# Explicit development-only renderer; never selected by the native app build.
kokoro = ["onnx", "reha-core/kokoro"]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
base64 = "0.22"
reha-core = { path = "../reha-core" }
uniffi = { version = "=0.32.1", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "reha-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]
