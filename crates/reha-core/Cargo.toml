[package]
name = "reha-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
onnx = ["dep:ort", "dep:ort-sys"]
onnx-download = ["onnx", "ort/download-binaries", "ort/copy-dylibs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.25", default-features = false }
kamadak-exif = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "ndarray"] }

[target.'cfg(target_os = "ios")'.dependencies]
ort-sys = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["disable-linking"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "reha"
path = "src/main.rs"
