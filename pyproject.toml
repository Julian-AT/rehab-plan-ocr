[project]
name = "rehab-plan-ocr-tools"
version = "0.3.0"
requires-python = "==3.12.*"
dependencies = [
  "certifi==2026.1.4",
  "icalendar==6.3.2",
  "pillow==12.3.0",
  "pillow-heif==1.7.0",
  "pyyaml==6.0.3",
  "ruff==0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", "artifacts", "models/private", "data/private", "target", "apps/ios/build", "packages/apple/VoiceActivity", ".tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# The ignored legacy artifacts directory must not decide import classification.
known-first-party = ["artifacts"]
