[workspace]
members = ["packages/rust/reha-core", "packages/rust/reha-ffi"]
default-members = ["packages/rust/reha-core"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

# Keep the native UI debuggable while running the image/OCR hot path at full
# speed. Unoptimized codecs alone take tens of seconds on a 24 MP photograph.
# Debug symbols and assertions stay enabled; unrelated UI crates build normally.
[profile.dev.package.reha-core]
opt-level = 3

# Logic regressions do not benchmark inference. Avoid optimizing the complete
# test harness on every edit; application and benchmark builds stay optimized.
[profile.test.package.reha-core]
opt-level = 1

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.imageproc]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

# Model and photo checksums must remain enabled, including during development.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
